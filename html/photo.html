<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Brandon's Portfolio</title>
    <link rel="stylesheet" href="styles/photo.css">
</head>
<body>
    <header>
        <nav id="navbar" class="navbar-expand-lg">
            <div class="container-fluid">
                <div class="d-flex justify-content-end w-100">
                    <ul class="navbar-nav d-flex flex-row list">
                        <li class="nav-item">
                            <a id="home-nav" class="nav-link" href="index.html">Home</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>   
    </header>    
    
    <main>
        <section id="hero">
            <div class="container-fluid">
                <div class="row g-3">
                    <div class="col-lg-10 mx-auto">
                        <h1 id="photo-header">Photo Gallery</h1>
                    </div>
                </div>
            </div>
        </section>

        <!--Images-->
        <section id="photo-gallery">
            <div class="container">
                <div class="row">
                    <div class="col-lg-10 mx-auto">
                        <div class="row g-3" id="image-gallery"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Modal -->
        <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img id="modalImage" src="" alt="Enlarged Image" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <section id="footer-section">
            <div class="container">
                <div class="row justify-content-center text-center">
                    <div class="col-12 d-flex align-items-center justify-content-center gap-3">
                        <div id="contact-icons" class="d-flex align-items-center gap-3">
                            <a class="email" href="mailto:brandon.yang1210@gmail.com">
                                <i class="fa-solid fa-envelope fa-2x"></i>
                            </a>
                            <a class="linked-in" href="https://www.linkedin.com/in/brandonyyang/" target="_blank">
                                <i class="fa-brands fa-linkedin fa-2x"></i>
                            </a>
                            <a class="git-hub" href="https://github.com/CloudUki" target="_blank">
                                <i class="fa-brands fa-github fa-2x"></i>
                            </a>
                        </div>
                        <p class="mb-0">&copy; 2025 Brandon Yang. <br> All rights reserved.</p>
                    </div>
                </div>
            </div>
        </section>
    </footer>

    <script src="javascript/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
